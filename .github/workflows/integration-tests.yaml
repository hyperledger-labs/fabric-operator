name: Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  KUBECONFIG_PATH: /tmp/kubeconfig.yaml
  OPERATOR_NAMESPACE: inttest
  DOCKERCONFIGJSON: ${{ secrets.DOCKERCONFIGJSON }}
  GO_VER: "1.25"

jobs:
  suite:
    runs-on: ubuntu-latest

    strategy:
      # Report every suite independently; a failure in one should not cancel
      # the others and hide their result.
      fail-fast: false
      matrix:
        suite:
          - ca
          - peer
          - orderer
          - console
#          - init
#          - migration
#          - e2ev2
#          - actions/ca
#          - actions/orderer
#          - actions/peer
#          - autorenew
#          - cclauncher
#          - restartmgr
#          - operatorrestart

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VER }}

      - name: Set up ginkgo
        run: |
          go install github.com/onsi/ginkgo/v2/ginkgo@v2.1.4

      - name: Set up KIND k8s cluster
        run: |
          make kind
          kubectl config view --raw > /tmp/kubeconfig.yaml

      - name: Install Fabric CRDs
        run: |
          kubectl kustomize config/crd | kubectl apply -f -

      - name: Run ${{ matrix.suite }} integration tests
        run: |
          # Each suite deletes its namespace in AfterSuite, so by the time a
          # later step runs there is nothing left to describe.  Sample the
          # cluster while the tests run instead, into a file so the sampling
          # does not bury the test output, and print it only on failure.
          (
            set +e
            while true; do
              echo "===== $(date -u +%H:%M:%SZ) ====="
              kubectl --kubeconfig "${KUBECONFIG_PATH}" get pods -A -o wide
              kubectl --kubeconfig "${KUBECONFIG_PATH}" get pods -A --no-headers \
                | awk '$4 != "Running" && $4 != "Completed" { print $1, $2 }' \
                | while read -r ns pod; do
                    kubectl --kubeconfig "${KUBECONFIG_PATH}" -n "${ns}" describe pod "${pod}"
                    kubectl --kubeconfig "${KUBECONFIG_PATH}" -n "${ns}" logs "${pod}" \
                      --all-containers --prefix --tail=50
                  done
              sleep 30
            done
          ) > /tmp/cluster-state.log 2>&1 &
          watcher=$!
          trap 'kill "${watcher}" 2>/dev/null || true' EXIT

          make integration-tests
        env:
          INT_TEST_NAME: ${{ matrix.suite }}

      # Only reached when the suite above fails; see the comment there for why
      # the state is sampled during the run rather than collected afterwards.
      - name: Cluster state captured during the run
        if: failure()
        run: tail -n 1000 /tmp/cluster-state.log
